name: Publish static assets

# Source: static-assets.manifest.json (URLs + metadata; hashes filled by CI)
# Output: .well-known/static-assets.json (hashed + Ed25519-signed)
on:
  push:
    branches: [main]
    paths:
      - 'static-assets.manifest.json'
      - 'tools/**'
      - '.github/workflows/publish-static-assets.yml'
  pull_request:
    paths:
      - 'static-assets.manifest.json'
      - 'tools/**'
      - '.github/workflows/publish-static-assets.yml'

permissions:
  contents: write

concurrency:
  group: publish-static-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate, download, and hash assets
        run: |
          set -euo pipefail
          chmod +x tools/publish_static_assets.sh tools/sign_static_assets.sh
          SIGN=0 ./tools/publish_static_assets.sh

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, hash, and sign catalog
        env:
          # JSON: {"keyId":"models-k1","privateKey":"-----BEGIN PRIVATE KEY-----\\n..."}
          STATIC_ASSETS_PRIVATE_KEY: ${{ secrets.STATIC_ASSETS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STATIC_ASSETS_PRIVATE_KEY:-}" ]; then
            echo "::error::STATIC_ASSETS_PRIVATE_KEY secret is not set on scomm-ai/version"
            exit 1
          fi
          chmod +x tools/publish_static_assets.sh tools/sign_static_assets.sh
          ./tools/publish_static_assets.sh

      - name: Commit signed catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/static-assets.json
          if git diff --staged --quiet; then
            echo "Signed catalog unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Publish signed static-assets catalog"
          git push
